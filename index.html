<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineer Work Report</title><link rel="stylesheet" href="style.css"></head><body><header><div><small>NOC OPERATIONS</small><h1>Engineer Work Report</h1></div><b>18/09/2026</b></header><nav><button data-v="submit">Daily Entry</button><button data-v="dashboard">Dashboard</button><button data-v="monthly">Monthly</button></nav><main><section id="submit"><div class="card"><small>ENGINEER PORTAL</small><h2>Submit Daily Work Report</h2><p>Enter your work counts and submit to Google Sheets.</p></div><div class="card grid"><label>Engineer<select id="engineer"></select></label><label>Date<input id="date" type="date" value="2026-09-18"></label><label>Resolved<input id="resolved" type="number" min="0" value="0"></label><label>In Progress<input id="inProgress" type="number" min="0" value="0"></label><label>Waiting<input id="waiting" type="number" min="0" value="0"></label><label>Forward<input id="forward" type="number" min="0" value="0"></label><label>In Call<input id="inCall" type="number" min="0" value="0"></label><label>Out Call<input id="outCall" type="number" min="0" value="0"></label><label>Partner / Eng Support<input id="partnerEngSupport" type="number" min="0" value="0"></label><label>Physical Support<input id="physicalSupport" type="number" min="0" value="0"></label><div class="actions"><button id="send">Submit Report</button></div><p id="msg"></p></div></section><section id="dashboard" class="hide"><div class="card"><h2>Team Dashboard</h2><button id="refresh">Refresh</button></div><div id="kpi" class="kpi"></div><div class="card scroll"><table id="tbl"></table></div></section><section id="monthly" class="hide"><div class="card"><h2>Monthly Summary</h2><input id="month" type="month" value="2026-09"><button id="load">Load</button></div><div class="card scroll"><table id="mtbl"></table></div></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
